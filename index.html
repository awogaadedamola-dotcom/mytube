<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTube</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #ff0000;
      color: white;
      padding: 15px 20px;
      font-size: 25px;
      font-weight: bold;
    }

    .search {
      text-align: center;
      padding: 20px;
      background: white;
    }

    #searchBox {
      width: 80%;
      max-width: 600px;
      padding: 13px 20px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 16px;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .video-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px #ccc;
    }

    .thumbnail {
      height: 160px;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      margin: 0 0 8px;
    }

    button {
      border: none;
      padding: 9px 14px;
      margin-right: 5px;
      border-radius: 5px;
      cursor: pointer;
    }

    .like {
      background: #eee;
    }

    .subscribe {
      background: #ff0000;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    ▶ MyTube
  </header>

  <div class="search">
    <input
      type="text"
      id="searchBox"
      placeholder="Search videos..."
      onkeyup="searchVideos()"
    >
  </div>

  <div class="videos" id="videoList">

    <div class="video-card">
      <div class="thumbnail">▶</div>
      <div class="info">
        <h3>My First Video</h3>
        <p>Welcome to MyTube!</p>
        <button class="like" onclick="likeVideo(this)">👍 Like</button>
        <button class="subscribe" onclick="subscribe(this)">Subscribe</button>
      </div>
    </div>

    <div class="video-card">
      <video controls width="100%">
        <source src="c:\Users\Hp\Downloads\lv_7643256190515809537_20260725065936 (2).mp4">
      </video>
      <div class="info">
        <h3>Football Highlights</h3>
        <p>Watch the latest highlights.</p>
        <button class="like" onclick="likeVideo(this)">👍 Like</button>
        <button class="subscribe" onclick="subscribe(this)">Subscribe</button>
      </div>
    </div>

    <div class="video-card">
      <div class="thumbnail">🎵</div>
      <div class="info">
        <h3>Music Video</h3>
        <p>Enjoy this amazing video.</p>
        <button class="like" onclick="likeVideo(this)">👍 Like</button>
        <button class="subscribe" onclick="subscribe(this)">Subscribe</button>
      </div>
    </div>

  </div>

  <script>
    function likeVideo(button) {
      button.innerHTML = "❤️ Liked";
    }

    function subscribe(button) {
      button.innerHTML = "✓ Subscribed";
    }

    function searchVideos() {
      let search = document
        .getElementById("searchBox")
        .value
        .toLowerCase();

      let cards = document.querySelectorAll(".video-card");

      cards.forEach(function(card) {
        let title = card.querySelector("h3").innerText.toLowerCase();

        if (title.includes(search)) {
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }
      });
    }
  </script>

</body>
</html>
